name: Publish to PyPI

on:
  release:
    types: [published]
  # ...and by hand, so a failed publish can be retried without deleting and
  # recreating the release.
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # DECLARING permissions REPLACES THE DEFAULT SET, it does not add to it.
      # With `id-token: write` alone the job's token loses `contents: read`,
      # and actions/checkout then fails with "Repository not found" - a 404
      # rather than a 403, so it reads like the repository is missing instead
      # of unreadable. Both lines are needed.
      contents: read
      # Trusted publishing. PyPI verifies this workflow's short-lived identity
      # token against the publisher configured on the project, so there is no
      # long-lived API token in the repository's secrets to leak or rotate.
      # Configure the publisher on PyPI first, or the upload is rejected.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: The wheel must contain the package, not only its dependencies
        # A build once produced a wheel that installed numpy, gemmi, biopython
        # and ipython and NO protein_inspector, with pip exiting 0 and the
        # import failing afterwards. That is exactly what a `pip install` user
        # would hit, and it is silent, so it is checked here rather than
        # discovered on PyPI where the version number cannot be reused.
        run: |
          python -m venv /tmp/wheelcheck
          /tmp/wheelcheck/bin/pip install --quiet dist/*.whl
          /tmp/wheelcheck/bin/python -c "import protein_inspector as p; print(p.INSPECTOR_VERSION)"
          /tmp/wheelcheck/bin/protein-inspector --help > /dev/null

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
