name: Publish to PyPI

on:
  release:
    types: [published]
  # ...and by hand, so a failed publish can be retried without deleting and
  # recreating the release.
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # DECLARING permissions REPLACES THE DEFAULT SET, it does not add to it.
      # With `id-token: write` alone the job's token loses `contents: read`,
      # and actions/checkout then fails with "Repository not found" - a 404
      # rather than a 403, so it reads like the repository is missing instead
      # of unreadable. Both lines are needed.
      contents: read
      # Trusted publishing. PyPI verifies this workflow's short-lived identity
      # token against the publisher configured on the project, so there is no
      # long-lived API token in the repository's secrets to leak or rotate.
      # Configure the publisher on PyPI first, or the upload is rejected.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        # PINNED, NOT '3.x'. The wheel is py3-none-any so the build does not
        # care - but the check below INSTALLS it, and that pulls gemmi, which
        # ships binary wheels only for the interpreters it has built for. '3.x'
        # floated to 3.15 and the check spent its time compiling gemmi from
        # source, then failed on a nanobind version mismatch: a release blocked
        # by the runner's Python moving, not by anything in this package.
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: The built version must match the release tag
        # setup.py carries a literal version= string that a human has to
        # remember to bump, so a release can be tagged v1.14.0 while the wheel
        # inside it still says 1.13.0. PyPI rejects that as a duplicate; the
        # worse case is a bump to the wrong new number, because a version on
        # PyPI cannot be reused or corrected afterwards. The tag is the number
        # someone chose deliberately, so the tag is the reference and setup.py
        # is what gets checked against it.
        # workflow_dispatch has no tag to compare against, hence the guard.
        if: github.event_name == 'release'
        run: |
          wheel=$(ls dist/*.whl)
          built=$(basename "$wheel" | cut -d- -f2)
          tag=${GITHUB_REF_NAME#v}
          echo "wheel reports $built, release is tagged $GITHUB_REF_NAME"
          if [ "$built" != "$tag" ]; then
            echo "::error::setup.py built $built but the release is tagged $GITHUB_REF_NAME - bump version= in setup.py and recreate the release"
            exit 1
          fi

      - name: The wheel must contain the package, not only its dependencies
        # A build once produced a wheel that installed numpy, gemmi, biopython
        # and ipython and NO protein_inspector, with pip exiting 0 and the
        # import failing afterwards. That is exactly what a `pip install` user
        # would hit, and it is silent, so it is checked here rather than
        # discovered on PyPI where the version number cannot be reused.
        run: |
          python -m venv /tmp/wheelcheck
          /tmp/wheelcheck/bin/pip install --quiet dist/*.whl
          /tmp/wheelcheck/bin/python -c "import protein_inspector as p; print(p.INSPECTOR_VERSION)"
          /tmp/wheelcheck/bin/protein-inspector --help > /dev/null

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
